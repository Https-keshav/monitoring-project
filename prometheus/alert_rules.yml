groups:
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"

      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% for 5 minutes (now {{ $value | printf \"%.1f\" }}%)"

      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% (now {{ $value | printf \"%.1f\" }}%)"

      - alert: DiskAlmostFull
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root disk above 85% (now {{ $value | printf \"%.1f\" }}%)"

  - name: application
    rules:
      - alert: HighErrorRate
        expr: |
          100 * sum(rate(app_http_requests_total{status=~"5.."}[2m]))
          / sum(rate(app_http_requests_total[2m])) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate is {{ $value | printf \"%.1f\" }}% (threshold 5%)"


      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx exporter reports Nginx is not responding"
